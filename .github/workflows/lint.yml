name: Linting

on:
  push:
    branches: [ main, develop ]
    paths:
      - "llm_pricing/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "llm_pricing/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --all-groups --all-extras

      - name: Check formatting with Black
        run: |
          uv run black --check llm_pricing tests

      - name: Lint with Ruff
        run: |
          uv run ruff check llm_pricing tests

      - name: Type check with MyPy
        run: |
          uv run mypy llm_pricing

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --all-groups --all-extras

      - name: Verify imports
        run: |
          uv run python -c "import llm_pricing; print('✓ Import successful')"

      - name: Check docstrings
        run: |
          uv run python -c "
import llm_pricing
import inspect

# Check that main class has docstring
assert llm_pricing.LLMPricing.__doc__, 'LLMPricing missing docstring'
print('✓ Main class has docstring')

# Check public methods have docstrings
for name in ['calculate', 'list_providers', 'list_models', 'add_provider', 'add_model', 'store_snapshot']:
    method = getattr(llm_pricing.LLMPricing, name)
    assert method.__doc__, f'{name} missing docstring'
print('✓ All public methods have docstrings')
"
